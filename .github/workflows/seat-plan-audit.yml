name: Seat-plan audit

on:
  schedule:
    # 12:05 Singapore time. Routine collection does not depend on slot release.
    - cron: '5 4 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Optional numeric library ID for at most two map-discovery searches; blank means catalog only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: seat-plan-audit
  cancel-in-progress: false

jobs:
  audit:
    outputs:
      notification_data: ${{ steps.audit.outputs.notification_data }}
    # Keep the validated Chromium/Xvfb environment stable across label migrations.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Singapore
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run seat-plans:verify
      - run: npx playwright install --with-deps chromium
      - name: Collect anonymously and audit
        id: audit
        env:
          DISCOVERY_BRANCH: ${{ inputs.branch }}
        shell: bash
        run: |
          args=()
          if [[ -n "$DISCOVERY_BRANCH" ]]; then
            if [[ ! "$DISCOVERY_BRANCH" =~ ^[0-9]+$ ]]; then
              echo 'Branch must be a numeric library ID.' >&2
              exit 1
            fi
            args+=(--branch "$DISCOVERY_BRANCH")
          fi
          xvfb-run --auto-servernum npm run seat-plans:ci -- "${args[@]}"
      - name: Preserve sanitized evidence, including drift or failure
        if: ${{ always() && steps.audit.outputs.artifact != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: seat-plan-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.audit.outputs.artifact }}
          if-no-files-found: error
          retention-days: 30

  notify:
    name: Send Pushover summary
    needs: audit
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: notifications
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Send audit notification
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SEND_NOTIFICATION_SSM_PARAM: ${{ secrets.SEND_NOTIFICATION_SSM_PARAM }}
          AUDIT_DATA: ${{ needs.audit.outputs.notification_data }}
          AUDIT_JOB_RESULT: ${{ needs.audit.result }}
        run: node scripts/seat-plan-notify.mjs
