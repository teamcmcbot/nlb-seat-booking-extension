name: Bug report
description: Report a reproducible Library Seats SG problem without personal data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Library Seats SG. GitHub issues are public.

        **Do not include NLB account IDs, masked account labels, booking references, cookies, credentials, raw account/API responses, or personal screenshots.** Use the private security-report link for a vulnerability.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed account identifiers, booking references, cookies, credentials, raw responses, and other personal information.
          required: true
        - label: This is not a security vulnerability that should be reported privately.
          required: true
  - type: input
    id: extension-version
    attributes:
      label: Library Seats SG version
      description: Find this in Settings or chrome://extensions.
      placeholder: 1.3.1
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation source
      options:
        - Chrome Web Store
        - GitHub release loaded unpacked
        - Local development build
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 140 on macOS 15
    validations:
      required: true
  - type: dropdown
    id: account-state
    attributes:
      label: Account state
      options:
        - Signed out / Guest
        - Signed in
        - Switching or returning from sign-in
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: NLB Seat Booking route
      description: Give only the route type, not a full URL containing personal data.
      placeholder: Home, account, booking details, or my bookings
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use generic branch, area, seat, and date descriptions where possible.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitised diagnostics
      description: Optional. Paste only console text or screenshots that contain no personal or authentication information.
